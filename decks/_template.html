<!DOCTYPE html>
<!--
  理財新手村 HTML 簡報模板（AGENTS.md 7.3、第 9 節）
  使用：複製到 decks/<日期>-<slug>/index.html，只替換 <main> 裡的 <section class="slide">。
  每個 section 要有 data-layout（版型）與 data-source（依據的 Wiki 頁面）。
  版型：cover | goals | point | steps | compare | quote-screen | orderbook | order-types | list | calc | calc-compound | calc-fund | t2 | quiz | recap | ending
  名詞小卡：dl.terms（由逐頁稿「術語」欄產生）
  互動元件：.sim（模擬下單）、.try（看答案）、.calc（交易成本）、.calc-c（複利）、.calc-f（預備金）、.toggle（IOC/FOK）、.t2（推算交割日）
  操作：← → 空白鍵翻頁｜點擊左右半邊｜手機左右滑｜N 講者備註｜F 全螢幕｜可列印成 PDF
-->
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{簡報標題}}｜理財新手村</title>
<style>
  :root {
    /* 清爽日式・藍綠色（草稿）。色碼只寫在這裡。 */
    --bg: #f7f5ef;        /* 生成り：米白底 */
    --paper: #fffdf8;
    --ink: #2b3a38;       /* 墨：主要文字 */
    --soft: #6b7775;      /* 鼠：次要文字 */
    --line: #dcd8cc;      /* 細線 */
    --teal: #3f7d78;      /* 青碧：主色 */
    --teal-deep: #24524f; /* 深青：標題強調 */
    --teal-pale: #e4efec; /* 淡青：色塊 */
    --mist: #c9ddd8;
    --shu: #c8553d;       /* 朱：只用在印章與答對提示 */
    --up: #c8453c;        /* 台股慣例：紅漲（只用於報價） */
    --down: #2f7d5a;      /* 綠跌（只用於報價） */
    --serif: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
    --sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { background-image: radial-gradient(rgba(60,70,60,.035) 1px, transparent 1px); background-size: 4px 4px; }
  .deck { position: relative; width: 100vw; height: 100vh; }

  .slide { position: absolute; inset: 0; padding: 9vh 9vw 11vh 11vw; display: flex; flex-direction: column; justify-content: center;
           opacity: 0; visibility: hidden; transform: translateY(12px); transition: opacity .45s ease, transform .45s ease, visibility .45s; }
  .slide.active { opacity: 1; visibility: visible; transform: none; }
  /* 左側直書標籤 */
  .slide::before { content: attr(data-chapter); position: absolute; left: 3.6vw; top: 9vh; writing-mode: vertical-rl; letter-spacing: .5em;
                   font-family: var(--serif); font-size: clamp(12px, 1.2vw, 16px); color: var(--teal); padding-top: 1em; border-top: 1px solid var(--teal); }
  .kicker { font-size: clamp(12px, 1.2vw, 16px); letter-spacing: .25em; color: var(--teal); margin: 0 0 2vh; display: flex; align-items: center; gap: .8em; }
  .kicker::before { content: ""; width: 2.4em; height: 1px; background: var(--teal); }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; color: var(--ink); }
  h1 { font-size: clamp(36px, 5.6vw, 76px); line-height: 1.3; letter-spacing: .04em; }
  h2 { font-size: clamp(26px, 3.6vw, 48px); line-height: 1.35; letter-spacing: .03em; margin-bottom: 1.4vh; }
  .lead { font-size: clamp(16px, 1.9vw, 26px); color: var(--soft); line-height: 1.7; margin: 0 0 4vh; }
  .lead strong { color: var(--teal-deep); font-weight: 700; }
  ul.dots { list-style: none; padding: 0; margin: 0; display: grid; gap: 1.8vh; max-width: 62em; }
  ul.dots li { font-size: clamp(16px, 1.9vw, 26px); line-height: 1.6; padding-left: 1.6em; position: relative; }
  ul.dots li::before { content: ""; position: absolute; left: .1em; top: .72em; width: .9em; height: 1px; background: var(--teal); }
  .note-sm { font-size: clamp(12px, 1.2vw, 15px); color: var(--soft); margin-top: 2.4vh; }

  /* cover */
  [data-layout=cover] { justify-content: center; }
  [data-layout=cover] h1 span { color: var(--teal-deep); }
  .hanko { position: absolute; right: 12vw; top: 18vh; width: clamp(64px, 7vw, 96px); aspect-ratio: 1; border: 2px solid var(--shu); color: var(--shu);
           border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: clamp(14px, 1.5vw, 20px); line-height: 1.15; text-align: center; transform: rotate(-8deg); }
  .wave { position: absolute; right: 0; bottom: 0; width: 40vw; height: 28vh; opacity: .9; }

  .cover-lead { font-size: clamp(15px, 1.7vw, 23px) !important; margin-bottom: 2.4vh !important; }
  ol.chapters { list-style: none; counter-reset: ch; padding: 0; margin: 0 0 1vh; display: flex; flex-wrap: wrap; gap: .6vw; max-width: 52vw; position: relative; z-index: 1; }
  ol.chapters li { counter-increment: ch; font-size: clamp(12px, 1.25vw, 16px); padding: .3em .8em; border: 1px solid var(--mist); background: var(--paper); color: var(--teal-deep); }
  ol.chapters li::before { content: counter(ch) "　"; color: var(--teal); font-family: var(--serif); }

  /* goals */
  ol.goals { list-style: none; counter-reset: g; padding: 0; margin: 0; display: grid; gap: 1.6vh; }
  ol.goals li { counter-increment: g; display: flex; align-items: baseline; gap: 1.2em; font-size: clamp(17px, 2vw, 28px); padding-bottom: 1.4vh; border-bottom: 1px solid var(--line); }
  ol.goals li::before { content: counter(g, decimal-leading-zero); font-family: var(--serif); color: var(--teal); font-size: .85em; min-width: 2em; }

  /* steps */
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.2vw; margin-top: 1vh; }
  .step { background: var(--paper); border-top: 3px solid var(--teal); padding: 2.4vh 1.2vw; min-height: 22vh; box-shadow: 0 1px 0 var(--line); }
  .step b { display: block; font-family: var(--serif); font-size: clamp(22px, 2.6vw, 36px); color: var(--teal); margin-bottom: 1vh; }
  .step span { font-size: clamp(14px, 1.5vw, 20px); line-height: 1.6; }
  .steps.three { grid-template-columns: repeat(3, 1fr); margin-bottom: 1vh; }
  .steps.three .step { min-height: 0; padding: 1.8vh 1.2vw; }
  .steps.three .step b { display: inline; font-size: clamp(18px, 2vw, 28px); margin-right: .4em; }
  .steps.three h3 { display: inline; font-size: clamp(15px, 1.6vw, 21px); color: var(--teal-deep); }
  .steps.three p { margin: .8vh 0 0; font-size: clamp(13px, 1.4vw, 18px); line-height: 1.6; }

  /* compare / cards */
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4vw; }
  .card { background: var(--paper); padding: 3vh 2vw; border: 1px solid var(--line); }
  .card h3 { font-size: clamp(18px, 2.1vw, 28px); margin-bottom: 1.2vh; color: var(--teal-deep); }
  .card p, .card li { font-size: clamp(14px, 1.6vw, 21px); line-height: 1.7; color: var(--ink); margin: 0; }
  .card.pale { background: var(--teal-pale); border-color: var(--mist); }
  .formula { display: inline-block; margin-top: 3vh; padding: 1.4vh 1.6vw; border: 1px solid var(--teal); font-family: var(--serif); font-size: clamp(16px, 2vw, 28px); color: var(--teal-deep); background: var(--paper); }
  .caution { margin-top: 2.6vh; padding: 1.4vh 1.4vw; border-left: 3px solid var(--teal); background: var(--teal-pale); font-size: clamp(14px, 1.6vw, 21px); }

  /* quote-screen：虛構報價卡 */
  .qs-wrap { display: grid; grid-template-columns: 1.1fr 1fr; gap: 3vw; align-items: center; }
  .quote { background: var(--paper); border: 1px solid var(--line); padding: 2.6vh 2vw; font-variant-numeric: tabular-nums; }
  .quote .qhead { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 1.2vh; margin-bottom: 1.6vh; }
  .quote .qname { font-family: var(--serif); font-size: clamp(16px, 1.8vw, 24px); }
  .quote .qtag { font-size: 12px; color: var(--soft); border: 1px solid var(--line); padding: 1px 8px; }
  .quote .qprice { font-size: clamp(40px, 5vw, 68px); color: var(--up); font-weight: 600; line-height: 1; }
  .quote .qchg { color: var(--up); font-size: clamp(16px, 1.8vw, 24px); margin-left: .6em; }
  .quote dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2vh 1vw; margin: 2vh 0 0; }
  .quote dt { font-size: clamp(11px, 1.1vw, 14px); color: var(--soft); }
  .quote dd { margin: 0; font-size: clamp(16px, 1.8vw, 24px); }
  .up { color: var(--up); } .down { color: var(--down); }

  /* K 線圖 */
  .kline { display: flex; gap: 3vw; align-items: center; }
  .kline svg { width: clamp(120px, 14vw, 200px); height: auto; flex: none; }

  /* timeline */
  .timeline { position: relative; height: 12vh; margin: 2vh 0 3vh; }
  .timeline .bar { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
  .timeline .seg { position: absolute; top: calc(50% - 5px); height: 10px; background: var(--teal); }
  .timeline .seg.light { background: var(--mist); }
  .timeline .tick { position: absolute; top: 0; transform: translateX(-50%); font-size: clamp(11px, 1.2vw, 15px); color: var(--soft); text-align: center; }
  .timeline .tick.b { top: auto; bottom: 0; }

  /* calc */
  .calc { display: grid; grid-template-columns: 1fr 1.2fr; gap: 3vw; align-items: start; }
  .calc label { display: block; font-size: clamp(13px, 1.4vw, 18px); color: var(--soft); margin-bottom: .6vh; }
  .calc input { width: 100%; font: inherit; font-size: clamp(18px, 2vw, 26px); padding: .5em .7em; border: 1px solid var(--line); background: var(--paper); color: var(--ink); margin-bottom: 2vh; }
  .calc input:focus { outline: 2px solid var(--mist); border-color: var(--teal); }
  .calc table { width: 100%; border-collapse: collapse; font-size: clamp(15px, 1.7vw, 22px); font-variant-numeric: tabular-nums; }
  .calc td { padding: 1.1vh .6vw; border-bottom: 1px solid var(--line); }
  .calc td:last-child { text-align: right; }
  .calc tr.total td { color: var(--teal-deep); font-weight: 700; border-bottom: 2px solid var(--teal); }

  /* quiz */
  .quiz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6vw; }
  .q { background: var(--paper); border: 1px solid var(--line); padding: 2.4vh 1.4vw; }
  .q p.qt { font-size: clamp(15px, 1.6vw, 21px); line-height: 1.6; margin: 0 0 1.6vh; font-weight: 600; }
  .q button { display: block; width: 100%; text-align: left; font: inherit; font-size: clamp(13px, 1.4vw, 18px); padding: .6em .8em; margin-bottom: .8vh; background: var(--bg); border: 1px solid var(--line); color: var(--ink); cursor: pointer; }
  .q button:hover { border-color: var(--teal); }
  .q button.ok { border-color: var(--teal); background: var(--teal-pale); }
  .q button.ng { border-color: var(--shu); color: var(--shu); }
  .q .exp { font-size: clamp(12px, 1.3vw, 16px); color: var(--soft); margin-top: 1vh; min-height: 2.6em; line-height: 1.6; }

  /* 五題版小測驗：較緊湊 */
  [data-layout=quiz] { justify-content: flex-start; padding-top: 7vh; }
  .quiz5 { gap: 1.2vw; }
  .quiz5 .q { padding: 1.4vh 1vw; }
  .quiz5 .q p.qt { font-size: clamp(13px, 1.3vw, 17px); margin-bottom: 1vh; }
  .quiz5 .q button { font-size: clamp(12px, 1.2vw, 15px); padding: .35em .7em; margin-bottom: .5vh; }
  .quiz5 .q .exp { min-height: 0; margin-top: .4vh; font-size: clamp(11px, 1.1vw, 14px); }
  .quiz5 .q .exp:empty { display: none; }

  /* recap */
  .recap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; }
  .recap div { border-top: 1px solid var(--teal); padding-top: 2vh; }
  .recap b { font-family: var(--serif); font-size: clamp(40px, 5vw, 72px); color: var(--teal); display: block; line-height: 1; margin-bottom: 1.4vh; font-weight: 500; }
  .recap span { font-size: clamp(16px, 1.9vw, 25px); line-height: 1.6; }

  /* ending */
  [data-layout=ending] .src { font-size: clamp(13px, 1.4vw, 17px); color: var(--soft); line-height: 1.9; }
  [data-layout=ending] a { color: var(--teal-deep); text-underline-offset: 3px; }
  .disclaimer { display: inline-block; margin-bottom: 3vh; padding: 1vh 1.4vw; border: 1px solid var(--teal); color: var(--teal-deep); font-family: var(--serif); font-size: clamp(16px, 1.9vw, 25px); }


  /* 動手算：看答案 */
  .try { margin-top: 2.4vh; display: flex; flex-wrap: wrap; gap: 1vw; align-items: flex-start; }
  .try .qbox { background: var(--paper); border: 1px dashed var(--teal); padding: 1.4vh 1.2vw; min-width: 14em; }
  .try .qbox p { margin: 0 0 .8vh; font-size: clamp(14px, 1.5vw, 19px); }
  .try button, .toggle button, .t2 button { font: inherit; font-size: clamp(13px, 1.4vw, 17px); padding: .45em 1em; border: 1px solid var(--teal); background: var(--paper); color: var(--teal-deep); cursor: pointer; }
  .try button:hover, .toggle button:hover, .t2 button:hover, .toggle button.on, .t2 button.on { background: var(--teal); color: #fff; }
  .try .hint { font-size: clamp(11px, 1.1vw, 14px) !important; color: var(--soft); }
  .try .ans { display: none; margin-top: .8vh; color: var(--teal-deep); font-weight: 700; font-size: clamp(14px, 1.5vw, 19px); }
  .try .qbox.open .ans { display: block; }
  .tag-b { display: inline-block; font-size: .75em; border: 1px solid var(--soft); color: var(--soft); padding: 0 .5em; margin-left: .4em; vertical-align: middle; }

  /* 五檔表 */
  table.book { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: clamp(15px, 1.8vw, 23px); background: var(--paper); }
  table.book th { font-weight: 500; font-size: .7em; color: var(--soft); padding: .6em 1.2em; border-bottom: 1px solid var(--line); }
  table.book td { padding: .55em 1.2em; text-align: center; border-bottom: 1px solid var(--line); }
  table.book td.bid { color: var(--down); } table.book td.ask { color: var(--up); }
  table.book td.mid { border-left: 1px solid var(--line); }

  /* IOC/FOK、T+2 */
  .toggle, .t2 { display: flex; gap: .8vw; flex-wrap: wrap; align-items: center; margin-top: 1.6vh; }
  .result { margin-top: 1.4vh; padding: 1.2vh 1.2vw; background: var(--teal-pale); border-left: 3px solid var(--teal); font-size: clamp(14px, 1.6vw, 20px); min-height: 2.8em; }
  .week { display: grid; grid-template-columns: repeat(9, 1fr); gap: .5vw; margin-top: 2vh; max-width: 46em; }
  .week div { border: 1px solid var(--line); background: var(--paper); text-align: center; padding: 1.2vh 0; font-size: clamp(13px, 1.4vw, 18px); }
  .week div.off { color: var(--soft); background: var(--bg); }
  .week div.t0 { border-color: var(--teal); color: var(--teal-deep); font-weight: 700; }
  .week div.pay { background: var(--teal); color: #fff; font-weight: 700; }
  .week small { display: block; font-size: .7em; }

  /* 複利、預備金試算 */
  .calc-c table, .calc-f table { width: 100%; }
  .bars { display: flex; gap: 2vw; align-items: flex-end; height: 16vh; margin-top: 5vh; }
  .bars div { flex: 1; background: var(--mist); position: relative; transition: height .3s; }
  .bars div.c { background: var(--teal); }
  .bars span { position: absolute; top: -1.6em; left: 0; right: 0; text-align: center; font-size: clamp(11px, 1.2vw, 14px); color: var(--soft); }
  .bars em { position: absolute; bottom: -1.7em; left: 0; right: 0; text-align: center; font-style: normal; font-size: clamp(11px, 1.2vw, 14px); color: var(--soft); }

  /* chrome */
  .progress { position: fixed; left: 0; bottom: 0; height: 2px; background: var(--teal); transition: width .45s; z-index: 5; }
  .pageno { position: fixed; right: 4vw; top: 4.5vh; font-family: var(--serif); font-size: 14px; color: var(--soft); letter-spacing: .1em; z-index: 5; }
  .brand { position: fixed; right: 4vw; bottom: 3.6vh; font-size: 12px; color: var(--soft); letter-spacing: .3em; z-index: 5; }
  .notes { display: none; position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(820px, 90vw); background: rgba(36,82,79,.95); color: #fff; padding: 14px 18px; font-size: 15px; line-height: 1.7; z-index: 6; }
  body.show-notes .slide.active .notes { display: block; }

  /* 模擬下單 .sim */
  .sim { display: grid; grid-template-columns: 1.15fr 1fr; gap: 2.2vw; font-size: clamp(12px, 1.25vw, 16px); align-items: start; }
  .srow { display: grid; grid-template-columns: 1.4em 6.2em 1fr; align-items: center; gap: .4em; padding: .45vh 0; border-bottom: 1px dashed var(--line); }
  .srow .sn { color: var(--teal); font-weight: 700; } .srow > b { font-weight: 500; }
  .seg { display: flex; flex-wrap: wrap; gap: .3em; align-items: center; }
  .seg button, .sim .send { font: inherit; padding: .3em .8em; border: 1px solid var(--teal); background: var(--paper); color: var(--teal-deep); cursor: pointer; }
  .seg button.on { background: var(--teal); color: #fff; }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  .sim select, .sim input { font: inherit; padding: .25em .4em; border: 1px solid var(--line); background: var(--paper); color: var(--ink); width: 5.5em; }
  .sim .send { margin-top: 1.4vh; font-weight: 700; padding: .5em 1.6em; background: var(--teal-deep); color: #fff; border-color: var(--teal-deep); }
  .sim .lockmsg { font-size: .85em; color: var(--soft); margin: .6vh 0 0; min-height: 1.4em; }
  table.book.mini { font-size: clamp(12px, 1.2vw, 15px); width: 100%; }
  table.book.mini th { padding: .4em .5em; } table.book.mini td { padding: .28em .5em; }
  table.book.mini tr.hitA td.ask, table.book.mini tr.hitB td.bid { background: var(--teal-pale); font-weight: 700; }
  .ticket { margin-top: 1vh; border: 1px solid var(--line); border-top: 3px solid var(--teal); background: var(--paper); padding: .8vh 1vw; line-height: 1.5; min-height: 8em; }
  .ticket p { margin: .35em 0; }
  .ticket .t-sum { color: var(--soft); font-size: .88em; margin-bottom: .3em; }
  .ticket b { color: var(--teal-deep); } .ticket .err { color: #c8553d; }
  /* 名詞小卡：逐頁稿「術語」欄，術語第一次出現的那一頁才有 */
  .terms { margin: 2.2vh 0 0; padding-top: 1.2vh; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: .5vh 1.8vw; font-size: clamp(11px, 1.15vw, 14px); line-height: 1.5; color: var(--soft); }
  .terms div { display: flex; gap: .5em; }
  .terms dt { color: var(--teal-deep); font-weight: 700; white-space: nowrap; }
  .terms dt::before { content: "名詞｜"; font-weight: 400; color: var(--soft); }
  .terms dd { margin: 0; }
  .remind { margin-top: 2.4vh; padding: 1.4vh 1.4vw; border: 1px solid var(--teal); background: var(--paper); font-size: clamp(14px, 1.6vw, 21px); }
  .remind b { color: var(--teal-deep); }
  @media (max-width: 760px) {
    .slide { padding: 7vh 7vw 10vh 12vw; overflow-y: auto; justify-content: flex-start; }
    .steps, .steps.three { grid-template-columns: 1fr; } .step { min-height: 0; padding: 1.4vh 3vw; }
    .sim { grid-template-columns: 1fr; }
    .pair, .qs-wrap, .calc, .quiz, .recap { grid-template-columns: 1fr; }
    .kline { flex-direction: column; align-items: flex-start; }
    .hanko { right: 8vw; top: auto; bottom: 26vh; } .wave { width: 80vw; height: 20vh; }
  }
  @media print {
    @page { size: 1280px 720px; margin: 0; }
    html, body { overflow: visible; height: auto; }
    .slide { position: relative; opacity: 1; visibility: visible; transform: none; width: 1280px; height: 720px; break-after: page; }
    .progress, .pageno, .notes { display: none !important; }
  }
</style>
</head>
<body>
<div class="deck">
<main>
  <section class="slide" data-layout="cover" data-chapter="{{章節}}" data-source="{{wiki 頁面}}">
    <p class="kicker">{{小標}}</p>
    <h1>{{標題}}</h1>
    <p class="lead">{{一句話}}</p>
    <aside class="notes">{{講者備註}}</aside>
  </section>
</main>
</div>
<div class="progress"></div>
<div class="pageno"></div>
<div class="brand">理財新手村</div>
<script>
(function () {
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var bar = document.querySelector('.progress'), no = document.querySelector('.pageno');
  var i = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
    bar.style.width = ((i + 1) / slides.length * 100) + '%';
    no.textContent = pad(i + 1) + ' / ' + pad(slides.length);
    history.replaceState(null, '', '#' + (i + 1));
  }
  function interactive(t) { return t.closest('a, button, input, label, .q, .calc, .calc-c, .calc-f, .try, .toggle, .t2, .week, .sim, select'); }
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (['ArrowRight', 'PageDown', ' '].indexOf(e.key) > -1) { e.preventDefault(); show(i + 1); }
    else if (['ArrowLeft', 'PageUp'].indexOf(e.key) > -1) { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Home') show(0); else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('show-notes');
    else if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  });
  document.addEventListener('click', function (e) { if (interactive(e.target)) return; show(e.clientX > innerWidth / 2 ? i + 1 : i - 1); });
  var x0 = null;
  document.addEventListener('touchstart', function (e) { x0 = interactive(e.target) ? null : e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) show(dx < 0 ? i + 1 : i - 1); x0 = null; });

  /* 小測驗 */
  document.querySelectorAll('.q').forEach(function (q) {
    q.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        q.querySelectorAll('button').forEach(function (x) { x.classList.remove('ok', 'ng'); });
        b.classList.add(b.dataset.ok ? 'ok' : 'ng');
        q.querySelector('.exp').textContent = (b.dataset.ok ? '答對了。' : '再想想。') + q.dataset.exp;
      });
    });
  });
  /* 交易成本試算器（假設不打折、未計最低手續費） */
  document.querySelectorAll('.calc:not(.calc-c):not(.calc-f)').forEach(function (c) {
    var p = c.querySelector('[name=price]'), s = c.querySelector('[name=shares]');
    function fmt(n) { return n.toLocaleString('zh-TW', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' 元'; }
    function run() {
      var amt = (parseFloat(p.value) || 0) * (parseFloat(s.value) || 0);
      var fee = amt * 0.001425, tax = amt * 0.003;
      c.querySelector('[data-o=amt]').textContent = fmt(amt);
      c.querySelector('[data-o=buy]').textContent = fmt(fee);
      c.querySelector('[data-o=sell]').textContent = fmt(fee);
      c.querySelector('[data-o=tax]').textContent = fmt(tax);
      c.querySelector('[data-o=total]').textContent = fmt(fee * 2 + tax);
    }
    p.addEventListener('input', run); s.addEventListener('input', run); run();
  });

  /* 看答案 */
  document.querySelectorAll('.try button').forEach(function (b) {
    b.addEventListener('click', function () { var o = b.closest('.qbox').classList.toggle('open'); b.textContent = o ? '收起答案' : '看答案'; });
  });
  function money(n) { return Math.round(n).toLocaleString('zh-TW') + ' 元'; }
  /* 複利試算（假設報酬率） */
  document.querySelectorAll('.calc-c').forEach(function (c) {
    var P = c.querySelector('[name=p]'), R = c.querySelector('[name=r]'), N = c.querySelector('[name=n]');
    function run() {
      var p = +P.value || 0, r = (+R.value || 0) / 100, n = +N.value || 0;
      var comp = p * Math.pow(1 + r, n), simple = p + p * r * n;
      c.querySelector('[data-o=comp]').textContent = money(comp);
      c.querySelector('[data-o=simple]').textContent = money(simple);
      c.querySelector('[data-o=gap]').textContent = money(comp - simple);
      var mx = Math.max(comp, simple, p) || 1, bs = c.querySelectorAll('.bars div');
      [[p, '本金'], [simple, '每年領出'], [comp, '複利']].forEach(function (v, k) {
        bs[k].style.height = (v[0] / mx * 100) + '%'; bs[k].querySelector('span').textContent = money(v[0]);
      });
    }
    [P, R, N].forEach(function (x) { x.addEventListener('input', run); }); run();
  });
  /* 緊急預備金試算 */
  document.querySelectorAll('.calc-f').forEach(function (c) {
    var S = c.querySelector('[name=salary]'), M = c.querySelector('[name=months]');
    function run() { c.querySelector('[data-o=fund]').textContent = money((+S.value || 0) * (+M.value || 0)); }
    [S, M].forEach(function (x) { x.addEventListener('input', run); }); run();
  });
  /* IOC / FOK 情境 */
  document.querySelectorAll('.toggle').forEach(function (g) {
    var out = g.parentNode.querySelector('.result');
    g.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        g.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
        out.textContent = b.dataset.r;
      });
    });
  });
  /* T+2 推算（只跳過週末，不考慮國定假日） */
  document.querySelectorAll('.t2').forEach(function (g) {
    var days = g.parentNode.querySelectorAll('.week div'), out = g.parentNode.querySelector('.result');
    var names = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
    g.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        g.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
        var t0 = +b.dataset.d, d = t0, left = 2, idx = [];
        while (left > 0) { d++; if (d % 7 < 5) left--; }
        days.forEach(function (x, k) { x.classList.remove('t0', 'pay'); if (k === t0) x.classList.add('t0'); if (k === d) x.classList.add('pay'); });
        out.textContent = names[t0] + '成交 → ' + (d >= 7 ? '下' : '') + names[d % 7] + '上午 10 點前，交割帳戶要有錢。';
      });
    });
  });
  /* 模擬下單：虛構五檔、盤中時段；手續費 0.1425%、證交稅 0.3%（假設不打折）；零股另比較最低手續費 20 元；不考慮國定假日 */
  document.querySelectorAll('.sim').forEach(function (m) {
    var BOOK = {
      lot: { ask: [[100.0, 10], [100.5, 20], [101.0, 15], [101.5, 30], [102.0, 25]], bid: [[99.9, 30], [99.8, 25], [99.7, 40], [99.6, 18], [99.5, 50]], u: '張', hold: 50, max: 99, cap: '整股五檔（張）' },
      odd: { ask: [[100.5, 80], [101.0, 120], [101.5, 60], [102.0, 200], [102.5, 150]], bid: [[100.0, 90], [99.9, 150], [99.8, 70], [99.7, 300], [99.5, 100]], u: '股', hold: 300, max: 999, cap: '盤中零股五檔（股）｜價格可能和整股不同' }
    };
    var st = { side: 'buy', unit: 'lot', ptype: 'limit', tif: 'ROD' }, shown = '';
    var price = m.querySelector('[name=price]'), qty = m.querySelector('[name=qty]'), day = m.querySelector('[name=day]');
    var out = m.querySelector('.ticket'), lock = m.querySelector('.lockmsg'), uLabel = m.querySelector('.ulabel');
    var table = m.querySelector('table.book'), cap = m.querySelector('.bookcap');
    var names = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
    function f1(p) { return p.toFixed(1); }
    function drawBook() {
      var B = BOOK[st.unit]; if (shown === st.unit) return; shown = st.unit;
      var h = '<tr><th>委買' + B.u + '數</th><th>委買價</th><th class="mid">委賣價</th><th>委賣' + B.u + '數</th></tr>';
      B.bid.forEach(function (x, k) { var y = B.ask[k]; h += '<tr><td>' + x[1] + '</td><td class="bid">' + f1(x[0]) + '</td><td class="ask mid">' + f1(y[0]) + '</td><td>' + y[1] + '</td></tr>'; });
      table.innerHTML = h; cap.textContent = B.cap;
    }
    function sync() {
      m.querySelectorAll('.srow[data-k]').forEach(function (r) {
        r.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', st[r.dataset.k] === b.dataset.v); });
      });
      var odd = st.unit === 'odd';
      m.querySelectorAll('[data-k=ptype] button, [data-k=tif] button').forEach(function (b) {
        b.disabled = odd && ['market', 'IOC', 'FOK'].indexOf(b.dataset.v) > -1;
      });
      price.disabled = st.ptype === 'market';
      uLabel.textContent = BOOK[st.unit].u; qty.max = BOOK[st.unit].max;
      lock.textContent = odd ? '零股只能用限價＋ROD（已自動鎖定），每 1 分鐘集合競價撮合一次。' : '';
      drawBook();
      m.querySelectorAll('tr').forEach(function (r) { r.classList.remove('hitA', 'hitB'); });
    }
    m.querySelectorAll('.srow[data-k] button').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.closest('.srow').dataset.k; st[k] = b.dataset.v;
        if (k === 'unit') {
          if (b.dataset.v === 'odd') { st.ptype = 'limit'; st.tif = 'ROD'; qty.value = 150; price.value = '101.0'; }
          else { qty.value = 15; price.value = '100.5'; }
        }
        sync();
      });
    });
    function t2(d0) { var d = d0, left = 2; while (left > 0) { d++; if (d % 7 < 5) left--; } return (d >= 7 ? '下' : '') + names[d % 7]; }
    m.querySelector('.send').addEventListener('click', function () {
      sync();
      var B = BOOK[st.unit], buy = st.side === 'buy', odd = st.unit === 'odd', q = +qty.value, lim = +price.value, u = B.u;
      var sum = '你的委託單：' + (buy ? '買進' : '賣出') + ' 範例股 0000｜' + (odd ? '零股 ' : '整股 ') + q + ' ' + u + '｜' +
        (st.ptype === 'market' ? '市價' : '限價 ' + f1(lim) + ' 元') + '｜' + st.tif;
      var head = '<p class="t-sum">' + sum + '</p>';
      if (!(q >= 1 && q <= B.max && Math.floor(q) === q)) { out.innerHTML = head + '<p class="err">數量要填 1～' + B.max + ' 的整數' + u + '。</p>'; return; }
      if (!buy && q > B.hold) { out.innerHTML = head + '<p class="err">你只有 ' + B.hold + ' ' + u + (odd ? '零股' : '') + '，不能賣 ' + q + ' ' + u + '。</p>'; return; }
      var book = buy ? B.ask : B.bid, mk = st.ptype === 'market';
      function ok(p) { return mk || (buy ? p <= lim : p >= lim); }
      var avail = 0; book.forEach(function (l) { if (ok(l[0])) avail += l[1]; });
      var fills = [], left = q, rows = table.querySelectorAll('tr');
      if (!(st.tif === 'FOK' && avail < q)) {
        book.forEach(function (l, k) { if (left > 0 && ok(l[0])) { var n = Math.min(left, l[1]); fills.push([l[0], n]); left -= n; rows[k + 1].classList.add(buy ? 'hitA' : 'hitB'); } });
      }
      var got = q - left, html = head;
      if (odd) html += '<p class="t-sum">10:00:20 送出 → 等 10:01 的集合競價撮合</p>';
      if (got) html += '<p><b>' + (odd ? '10:01 撮合，' : '') + '成交 ' + got + ' ' + u + '：</b>' + fills.map(function (x) { return f1(x[0]) + ' 元 × ' + x[1] + ' ' + u; }).join('、') + '</p>';
      var other = buy ? '開價 ' + f1(lim) + ' 元以下的' + (odd ? '零股' : '') + '賣單' : '出價 ' + f1(lim) + ' 元以上的' + (odd ? '零股' : '') + '買單';
      if (st.tif === 'FOK' && avail < q) html += '<p><b>整筆取消：</b>現在只能馬上成交 ' + avail + ' ' + u + '，不能一次全部成交。</p>';
      else if (left && st.tif === 'IOC') html += got ? '<p><b>剩下 ' + left + ' ' + u + '立即取消。</b></p>' : '<p><b>全部 ' + left + ' ' + u + '立即取消：</b>現在沒有' + other + '可以馬上成交。</p>';
      else if (left && odd) html += '<p><b>' + (got ? '剩下 ' : '這次沒成交，全部 ') + left + ' 股繼續排隊：</b>' + (got ? '' : '沒有' + other + '。') + '之後每分鐘再撮合，有效到 13:30；沒成交不會留到盤後零股。</p>';
      else if (left) html += '<p><b>' + (got ? '剩下 ' : '全部 ') + left + ' 張繼續排隊：</b>以 ' + f1(lim) + ' 元排在' + (buy ? '委買' : '委賣') + '，同價位排在先送出的單後面；今天收盤前有效。</p>';
      if (got) {
        var amt = 0; fills.forEach(function (x) { amt += x[0] * x[1] * (odd ? 1 : 1000); });
        var fee = amt * 0.001425, tax = buy ? 0 : amt * 0.003, d = t2(+day.value), feeUse = fee;
        html += '<p>成交金額 ' + money(amt) + '｜手續費 ' + money(fee) + (buy ? '' : '｜證交稅 ' + money(tax)) + '</p>';
        if (odd && fee < 20) { feeUse = 20; html += '<p class="t-sum">券商常有最低手續費（例如 20 元）：手續費變 20 元，約占 ' + (20 / amt * 100).toFixed(2) + '%（標準 0.1425%），下面以 20 元計。</p>'; }
        html += buy ? '<p><b>' + d + '上午 10 點前</b>，交割帳戶要有 ' + money(amt + feeUse) + '。</p>'
                    : '<p><b>' + d + '上午 11 點後</b>，約 ' + money(amt - feeUse - tax) + ' 匯入交割帳戶。</p>';
      }
      out.innerHTML = html;
    });
    sync();
  });
  /* 放在 GitHub Pages（帳號.github.io/repo/）時，把 Wiki 連結換成 GitHub 上的檔案網址 */
  (function () {
    var h = location.hostname, seg = location.pathname.split('/').filter(Boolean);
    if (!/\.github\.io$/.test(h) || !seg.length) return;
    var base = 'https://github.com/' + h.split('.')[0] + '/' + seg[0] + '/blob/main/';
    document.querySelectorAll('a.repo').forEach(function (a) { a.href = base + a.dataset.path; });
  })();
  show(i);
})();
</script>
</body>
</html>
